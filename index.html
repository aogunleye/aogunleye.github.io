<script>
  document.addEventListener("DOMContentLoaded", () => {
    const matrixItems = document.querySelectorAll('.matrix-item');
    const hasVisited = sessionStorage.getItem('visitedIndex');
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';

    if (!hasVisited) {
      // 1. Première arrivée sur l'onglet : animation des numéros
      matrixItems.forEach((item) => {
        const labelText = item.textContent;
        item.innerHTML = `<span class="item-text">${labelText}</span><span class="calc-stream"></span>`;
        
        const stream = item.querySelector('.calc-stream');
        const text = item.querySelector('.item-text');

        // Animation 1 : Défilement des numéros
        const interval = setInterval(() => {
          stream.textContent = Math.random().toFixed(4);
        }, 50);

        setTimeout(() => {
          // Arrêt de l'animation des numéros
          clearInterval(interval);
          stream.style.display = 'none';
          text.style.opacity = '1';

          // Animation 2 : Décryptage du texte
          let iteration = 0;
          const decryptInterval = setInterval(() => {
            text.textContent = labelText
              .split('')
              .map((char, index) => {
                if (char === ' ') return ' ';
                if (index < iteration) return labelText[index];
                return chars[Math.floor(Math.random() * chars.length)];
              })
              .join('');

            if (iteration >= labelText.length) {
              clearInterval(decryptInterval);
              text.textContent = labelText;
            }
            iteration += 1/3;
          }, 50);

        }, 2500);
      });

      // Enregistrement spécifique à cet onglet
      sessionStorage.setItem('visitedIndex', 'true');
    } else {
      // 2. Navigation au sein du même onglet : affichage direct
      matrixItems.forEach((item) => {
        const labelText = item.textContent;
        item.innerHTML = `<span class="item-text" style="opacity: 1;">${labelText}</span>`;
      });
    }
  });
</script>
