<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdul. O Archive | Data Analyst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* reglages du corps de la page pour tout centrer */
        body{background-color:#f8f9fa;color:#333;transition:0.3s;height:100vh;display:flex;align-items:center;}
        
        /* ici c'est pour le mode nuit */
        [data-bs-theme="dark"] body{background-color:#121212;color:#f8f9fa;}

        /* style de la barre de navigation */
        .navbar{background:rgba(255,255,255,0.9);border-bottom:1px solid #eee;backdrop-filter:blur(10px);}
        [data-bs-theme="dark"] .navbar{background:rgba(18,18,18,0.9);border-bottom:1px solid #333;}
        
        /* icone du bouton theme */
        #themeBtn{cursor:pointer;border:none;background:none;font-size:1.2rem;}

        /* bouton au milieu de l'ecran */
        .btn-main{border:1px solid #000;color:#000;padding:12px 30px;text-decoration:none;transition:0.3s;font-weight:bold;}
        [data-bs-theme="dark"] .btn-main{border-color:#fff;color:#fff;}
        
        /* effet au survol du bouton */
        .btn-main:hover{background:#000;color:#fff;}
        [data-bs-theme="dark"] .btn-main:hover{background:#fff;color:#000;}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Abdul. O Archive</a>
        <div class="d-flex align-items-center order-lg-3">
            <button id="themeBtn">☀️</button>
        </div>
    </div>
</nav>
<div class="container text-center">
    <h1 class="display-1 fw-bold mb-4">Abdul. O Archive<span class="text-muted">.</span></h1>    
    <a href="portfolio.html" class="btn-main">ENTRER DANS LE PORTFOLIO</a>
</div>
<script>
    /* script pour que le bouton soleil/lune fonctionne */
    const themeBtn=document.getElementById('themeBtn');
    const html=document.documentElement;

    const updateIcon=(t)=>{themeBtn.innerHTML=t==='light'?'☀️':'🌙';};

    // on verifie si on a deja choisi un theme avant
    const savedTheme=localStorage.getItem('theme')||'light';
    html.setAttribute('data-bs-theme',savedTheme);
    updateIcon(savedTheme);

    // changer de couleur quand on clique
    themeBtn.addEventListener('click',()=>{
        const n=html.getAttribute('data-bs-theme')==='light'?'dark':'light';
        html.setAttribute('data-bs-theme',n); 
        localStorage.setItem('theme',n); // on garde le choix en memoire
        updateIcon(n);});
</script>
</body></html>
