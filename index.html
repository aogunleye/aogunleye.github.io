<script>
  document.addEventListener("DOMContentLoaded", () => {
    const matrixItems = document.querySelectorAll('.matrix-item');
    const hasVisited = sessionStorage.getItem('visitedIndex');
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';

    if (!hasVisited) {
      matrixItems.forEach((item) => {
        const labelText = item.textContent;
        item.innerHTML = `<span class="item-text">${labelText}</span><span class="calc-stream"></span>`;
        
        const stream = item.querySelector('.calc-stream');
        const text = item.querySelector('.item-text');

        const interval = setInterval(() => {
          stream.textContent = Math.random().toFixed(6);
        }, 50);

        setTimeout(() => {
  clearInterval(interval);

  let radius = 0;
  const center = Math.floor(labelText.length / 2);

  const decryptInterval = setInterval(() => {
    const currentRadius = Math.floor(radius);

    // 1. Construit le texte qui s'étend depuis le milieu
    const textPart = labelText
      .split('')
      .map((char, index) => {
        if (Math.abs(index - center) > currentRadius) return '';
        if (Math.abs(index - center) === currentRadius && currentRadius < center) {
          return chars[Math.floor(Math.random() * chars.length)];
        }
        return labelText[index];
      })
      .join('');

    // 2. Calcule les chiffres restants sur les bords pour effacer le trou
    const digitsNeeded = Math.max(0, 6 - currentRadius * 2);
    const sideDigits = Math.floor(digitsNeeded / 2);

    if (digitsNeeded > 0) {
      const leftNum = Math.floor(Math.random() * Math.pow(10, sideDigits)).toString().padStart(sideDigits, '0');
      const rightNum = Math.floor(Math.random() * Math.pow(10, sideDigits)).toString().padStart(sideDigits, '0');
      stream.textContent = `${leftNum}${textPart}${rightNum}`;
    } else {
      stream.textContent = textPart;
    }

    // 3. Arrêt une fois le mot complété
    if (radius >= Math.max(center, labelText.length - center) + 1) {
      clearInterval(decryptInterval);
      stream.textContent = labelText;
    }

    radius += 0.25; // Durée de l'extension : environ 1 seconde
  }, 50);

}, 1500);

      });

      sessionStorage.setItem('visitedIndex', 'true');
    } else {
      matrixItems.forEach((item) => {
        const labelText = item.textContent;
        item.innerHTML = `<span class="item-text" style="opacity: 1;">${labelText}</span>`;
      });
    }
  });
</script>
